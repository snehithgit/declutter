# Relative paths are relative to this configuration file.
data_dir = "./data"
# Explicitly enable copy exports only after creating a separate writable directory:
# export_dir = "./exports"
library_roots = []

[server]
host = "127.0.0.1"
port = 8765

[ollama]
url = "http://127.0.0.1:11434"
model = "hf.co/ggml-org/vllm-d3-nano-GGUF:Q8_0"
concurrency = 1
protocol = "decision" # D3 Nano; use "chat" only for a compatible vision chat model.

[images]
thumbnail_size = 256
preview_size = 1024

[classification]
uncertainty_threshold = 0.6
