[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photosift"
version = "0.3.0"
description = "Local photo decluttering with a persistent worker and remote Ollama"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "Pillow>=11,<13", "pillow-heif>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
photosift = "photosift.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photosift = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
