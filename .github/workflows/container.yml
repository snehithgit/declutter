name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test backend
        run: python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and build frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Build, smoke test, and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: photosift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container startup and restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/photosift-data" "$RUNNER_TEMP/photosift-library"
          sudo chown 1000:1000 "$RUNNER_TEMP/photosift-data"
          docker run --detach --name photosift-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PHOTOSIFT_ALLOW_LAN=1 \
            -v "$RUNNER_TEMP/photosift-data:/data" \
            -v "$RUNNER_TEMP/photosift-library:/library:ro" \
            -p 127.0.0.1:8765:8765 photosift:ci
          wait_for_ready() {
            for attempt in $(seq 1 30); do
              if curl --silent --fail http://127.0.0.1:8765/api/health | \
                python -c 'import json,sys; s=json.load(sys.stdin); assert s["status"]=="ok" and s["worker"]["state"]=="ready" and s["database"]["journal_mode"]=="wal"'; then
                return 0
              fi
              sleep 2
            done
            docker logs photosift-ci
            return 1
          }
          wait_for_ready
          curl --fail --silent http://127.0.0.1:8765/ | grep -q 'PhotoSift'
          docker restart photosift-ci
          # Allow the previous worker lease to expire before judging recovery.
          sleep 20
          wait_for_ready
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs photosift-ci || true
          docker rm -f photosift-ci || true
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
